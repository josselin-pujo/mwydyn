[workspace]
resolver = "2"
members = [
    "crates/mwydyn-data",
    "crates/mwydyn-schema",
    "crates/mwydyn-core",
    "crates/mwydyn-vectors",
    "crates/mwydyn-wasm",
    "crates/mwydyn-guest-minimal",
    "crates/mwydyn-guest-counter",
    "crates/mwydyn-guest",
    "crates/mwydyn-guest-store",
    "crates/mwydyn-guest-dedup",
    "crates/mwydyn-guest-js",
    "crates/mwydyn-js",
]

# round 43 (v0): the JS guest wrapper crashes under opt-level>=2
# (release-only, C stays O2 both ways — an optimizer-sensitive FFI
# UB under investigation, work-notes/43). Pinned to 0 until found.
[profile.release.package.mwydyn-guest-js]
opt-level = 0

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
