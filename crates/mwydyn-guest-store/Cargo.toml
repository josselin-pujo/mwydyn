[package]
name = "mwydyn-guest-store"
version = "0.1.0"
edition = "2021"
publish = false

# The STATELESS example guest (round 40, SDK since 41): one letter
# in — `{"body": <bytes>, "replyTo": <addr>}` — one ambient round
# (put → get → len → caps) and a receipt where every refusal is a
# FACT by name. The capped/uncapped difference is the embedding's
# declaration; the guest just shows what it saw.
[lib]
crate-type = ["cdylib"]

[dependencies]
mwydyn-guest = { path = "../mwydyn-guest" }
