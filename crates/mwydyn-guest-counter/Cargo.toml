[package]
name = "mwydyn-guest-counter"
version = "0.1.0"
edition = "2021"
publish = false

# The DURABLE example guest (rounds 37+39, SDK since 41): state in
# the actor struct, rollback + snapshots by declaration —
# durable_entry! owns the exports and the mwydyn_decl flag. Built
# via scripts/build-guest.sh (wasm32-unknown-unknown).
[lib]
crate-type = ["cdylib"]

[dependencies]
mwydyn-guest = { path = "../mwydyn-guest" }
