# cargo-deny policy — the LICENSE ADMISSION LIST (spec §8 thinking,
# applied to dependencies): a crate is a dependency only if its
# license satisfies this policy; everything else is named and
# refused. Run: cargo deny check licenses

[graph]
all-features = true

[licenses]
version = 2
# The admission list (round 24). Preferred: Apache-2.0; the project
# license is pure Apache-2.0 (note: GPLv2-only incompatible — the one
# known cost, accepted).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception", # the wasmtime/cranelift family
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",    # unicode-ident, via proc-macro2
    "CC0-1.0",
    # ring, if it ever arrives via rustls: a multi-license mix
    # (OpenSSL/ISC/BSD) — permissive but nonstandard; prefer the
    # aws-lc-rs provider when QUIC lands (Apache-2.0 OR ISC).
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
# Copyleft and the rest: refused BY ADMISSION — cargo-deny ≥0.20
# removed deny lists, which suits mwydyn perfectly: everything not
# on the allow list is refused by name in review. GPL-2.0/3.0,
# AGPL, LGPL-2.1/3.0, SSPL are OUTSIDE this list on purpose.
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
